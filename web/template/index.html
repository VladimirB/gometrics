<!DOCTYPE html>
<html>
<head>
    <title>Таблица с метриками</title>
<head>
<style>
    table {
        border-spacing: 5px;
        width: 50%;
    }
    th {
        text-align: left;
    }
</style>
<body>
    <h1>Список метрик</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Value</th>
        </tr>
        {{range $key, $value := .Metrics}}
        <tr>
            <td>{{$key}}</td>
            <td>{{$value.MType}}</td>
            <td>{{$value.Value}}</td>
        </tr>
        {{end}}
        </table>
</body>
</html>
